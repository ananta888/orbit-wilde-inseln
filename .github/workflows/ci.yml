name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements-dev.lock -e '.[dev]'
      - run: python -m pytest
      - run: python -m ruff check server tests tools
      - run: python -m mypy
      - run: python -m orbit_server.missions.cli validate
      - run: python -m orbit_server.missions.cli build
      - run: python tools/validate_todos.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -c requirements-dev.lock -e .
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Real browser and emulated mission input
        env:
          ORBIT_URL: http://127.0.0.1:8765
        run: |
          mkdir -p .local
          python -m orbit_server --http --port 8765 > .local/server.log 2>&1 &
          orbit_pid=$!
          trap 'kill "$orbit_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health; then break; fi
            sleep 1
          done
          npm run test:browser
          node tools/diagnostics/check-mission-xr.mjs
