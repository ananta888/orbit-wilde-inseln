[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-wilde-inseln"
version = "0.1.0"
description = "Laptop-authoritative WebXR island adventures with modular learning missions"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{name = "Peter Stuiber"}]
dependencies = ["aiohttp>=3.14.3,<4", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema"]

[project.scripts]
orbit-server = "orbit_server.__main__:main"
orbit-content = "orbit_server.missions.cli:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E731"]

[tool.mypy]
python_version = "3.11"
files = ["server/orbit_server/missions", "server/orbit_server/persistence", "server/orbit_server/learning", "server/orbit_server/fitness", "server/orbit_server/ai/contracts.py", "server/orbit_server/speech"]
check_untyped_defs = true
warn_unused_ignores = true
follow_imports = "silent"
